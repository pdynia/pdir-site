# Refreshes the product pages from visanto.com once a week and redeploys if anything changed.
name: Update product catalogue

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays, 05:17 UTC (09:17 in Dubai)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild products page and home-page counts
        run: python3 scripts/build_products.py
      - name: Commit and push if the catalogue changed
        id: commit
        run: |
          git add site
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No catalogue changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update product catalogue from visanto.com"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Redeploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
